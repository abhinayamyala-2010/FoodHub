<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodHub - Admin Orders</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 9px 15px;
            border-radius: 7px;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .stat h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat p {
            font-size: 27px;
            font-weight: bold;
        }

        .orders {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .order-header h2 {
            font-size: 21px;
        }

        .order-date {
            color: #6b7280;
            font-size: 13px;
            margin-top: 5px;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .info-box h4 {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .info-box p {
            font-weight: bold;
            font-size: 14px;
        }

        .items {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
            margin-bottom: 15px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }

        .bill {
            max-width: 400px;
            margin-left: auto;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            color: #4b5563;
        }

        .bill-total {
            border-top: 2px solid #e5e7eb;
            margin-top: 7px;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #111827;
        }

        .payment-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 9px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .payment-section h3 {
            margin-bottom: 10px;
            color: #166534;
        }

        .payment-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .payment-method {
            font-weight: bold;
        }

        .payment-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .paid {
            background: #dcfce7;
            color: #166534;
        }

        .mark-paid {
            background: #16a34a;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .mark-paid:hover {
            background: #15803d;
        }

        .status-section {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-section label {
            font-weight: bold;
        }

        select {
            padding: 9px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: white;
        }

        .update-status {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .update-status:hover {
            background: #1d4ed8;
        }

        .empty {
            background: white;
            text-align: center;
            padding: 50px;
            border-radius: 12px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
            background: #e5e7eb;
            color: #374151;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .customer-info {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            .container {
                padding: 0 12px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .customer-info {
                grid-template-columns: 1fr;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 7px;
            }

        }

    </style>


<style id="foodhub-cafe-theme">
:root{--cafe-espresso:#3b2418;--cafe-coffee:#5a3825;--cafe-caramel:#b9783f;--cafe-gold:#d6a15d;--cafe-cream:#fff8ed;--cafe-beige:#f3e5d0;--cafe-latte:#ead4b7;--cafe-text:#2f211a;--cafe-white:#fffdf9;--cafe-shadow:0 8px 24px rgba(59,36,24,.12)}
html,body{background:var(--cafe-cream)!important;color:var(--cafe-text)!important}
body{font-family:Georgia,'Times New Roman',serif!important}
header,.header,.navbar,nav,.nav,.topbar,.sidebar{background:var(--cafe-espresso)!important;color:#fff8ed!important}
header a,.header a,.navbar a,nav a,.nav a,.topbar a,.sidebar a{color:#fff8ed!important}
h1,h2,h3,h4,h5,h6{color:var(--cafe-espresso)!important}
button,.btn,.button,input[type=submit],input[type=button]{background:var(--cafe-coffee)!important;color:#fff8ed!important;border-color:var(--cafe-coffee)!important;border-radius:10px!important;box-shadow:0 3px 8px rgba(59,36,24,.16)!important}
button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{background:var(--cafe-caramel)!important;border-color:var(--cafe-caramel)!important}
a{color:var(--cafe-coffee)}
a:hover{color:var(--cafe-caramel)}
.card,.food-card,.menu-card,.product-card,.order-card,.stat-card,.box,.panel,.container-card,.admin-card,.reservation-card,.review-card,.table-card,.modal-content{background:var(--cafe-white)!important;border-color:var(--cafe-latte)!important;box-shadow:var(--cafe-shadow)!important;border-radius:14px!important}
input,select,textarea{background:#fffdf9!important;color:var(--cafe-text)!important;border:1px solid #d8b994!important;border-radius:8px!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--cafe-caramel)!important;box-shadow:0 0 0 3px rgba(185,120,63,.15)!important}
th{background:var(--cafe-coffee)!important;color:#fff8ed!important}
tr:nth-child(even){background:#fbf1e2!important}
.badge,.status,.tag,.category{background:var(--cafe-beige)!important;color:var(--cafe-espresso)!important}
.logo,.brand{color:var(--cafe-gold)!important}
footer{background:var(--cafe-espresso)!important;color:#fff8ed!important}
img{border-radius:10px}
hr{border-color:var(--cafe-latte)!important}
.cafe-theme-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--cafe-beige);color:var(--cafe-espresso);font-size:13px;font-weight:700;letter-spacing:.4px}
</style>
</head>


<body>


<header>

    <h1>
        🍽️ FoodHub Admin Orders
    </h1>

    <a
        href="admin-dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</header>


<div class="container">


    <div class="stats">

        <div class="stat">

            <h3>
                Total Orders
            </h3>

            <p id="totalOrders">
                0
            </p>

        </div>


        <div class="stat">

            <h3>
                Pending Orders
            </h3>

            <p id="pendingOrders">
                0
            </p>

        </div>


        <div class="stat">

            <h3>
                Preparing
            </h3>

            <p id="preparingOrders">
                0
            </p>

        </div>


        <div class="stat">

            <h3>
                Paid Orders
            </h3>

            <p id="paidOrders">
                0
            </p>

        </div>

    </div>


    <div
        class="orders"
        id="ordersContainer"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>


<script>

const API = "/api";

let allOrders = [];


// ======================================================
// LOAD ORDERS
// ======================================================

async function loadOrders() {

    try {

        const response =
            await fetch(
                `${API}/admin/orders`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load orders"
            );

        }


        allOrders =
            await response.json();


        updateStats();

        displayOrders();


    } catch (error) {

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        document.getElementById(
            "ordersContainer"
        ).innerHTML = `

            <div class="empty">

                <h2>
                    ❌ Unable to load orders
                </h2>

                <p>
                    Make sure the FoodHub server
                    is running.
                </p>

            </div>

        `;

    }

}


// ======================================================
// UPDATE STATS
// ======================================================

function updateStats() {

    document.getElementById(
        "totalOrders"
    ).textContent =
        allOrders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =

        allOrders.filter(
            function(order) {

                return order.status === "Pending";

            }
        ).length;


    document.getElementById(
        "preparingOrders"
    ).textContent =

        allOrders.filter(
            function(order) {

                return order.status === "Preparing";

            }
        ).length;


    document.getElementById(
        "paidOrders"
    ).textContent =

        allOrders.filter(
            function(order) {

                return order.payment_status === "Paid";

            }
        ).length;

}


// ======================================================
// DISPLAY ORDERS
// ======================================================

function displayOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    if (allOrders.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    📦 No orders yet
                </h2>

                <p>
                    Customer orders will appear here.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    allOrders.forEach(
        function(order) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            let itemsHTML = "";


            const items =
                Array.isArray(order.items)
                    ? order.items
                    : [];


            items.forEach(
                function(item) {

                    const itemTotal =
                        Number(item.price) *
                        Number(item.quantity);


                    itemsHTML += `

                        <div class="item">

                            <span>

                                ${escapeHTML(
                                    item.name
                                )}

                                ×
                                ${item.quantity}

                            </span>

                            <strong>

                                ₹${itemTotal.toFixed(2)}

                            </strong>

                        </div>

                    `;

                }
            );


            const paymentStatus =
                order.payment_status ||
                "Pending";


            const paymentClass =
                paymentStatus === "Paid"
                    ? "paid"
                    : "pending";


            card.innerHTML = `

                <div class="order-header">

                    <div>

                        <h2>
                            Order #${order.id}
                        </h2>

                        <div class="order-date">

                            ${formatDate(
                                order.order_date
                            )}

                        </div>

                        <span class="status-badge">

                            Status:
                            ${escapeHTML(
                                order.status ||
                                "Pending"
                            )}

                        </span>

                    </div>

                </div>


                <div class="customer-info">


                    <div class="info-box">

                        <h4>
                            Customer
                        </h4>

                        <p>

                            ${escapeHTML(
                                order.customer_name ||
                                "Guest"
                            )}

                        </p>

                    </div>


                    <div class="info-box">

                        <h4>
                            Phone
                        </h4>

                        <p>

                            ${escapeHTML(
                                order.customer_phone ||
                                "Not provided"
                            )}

                        </p>

                    </div>


                    <div class="info-box">

                        <h4>
                            Order Type
                        </h4>

                        <p>

                            ${escapeHTML(
                                order.order_type ||
                                "Delivery"
                            )}

                        </p>

                    </div>


                    <div class="info-box">

                        <h4>
                            Order Status
                        </h4>

                        <p>

                            ${escapeHTML(
                                order.status ||
                                "Pending"
                            )}

                        </p>

                    </div>

                </div>


                ${
                    order.order_type === "Delivery"
                    ? `

                        <div
                            class="info-box"
                            style="margin-bottom:15px"
                        >

                            <h4>
                                Delivery Address
                            </h4>

                            <p>

                                ${escapeHTML(
                                    order.delivery_address ||
                                    "Not provided"
                                )}

                            </p>

                        </div>

                    `
                    : ""
                }


                <div class="items">

                    ${
                        itemsHTML ||
                        "<p>No items found</p>"
                    }

                </div>


                <div class="bill">


                    <div class="bill-row">

                        <span>
                            Subtotal
                        </span>

                        <strong>

                            ₹${Number(
                                order.subtotal || 0
                            ).toFixed(2)}

                        </strong>

                    </div>


                    <div class="bill-row">

                        <span>
                            Discount
                        </span>

                        <strong>

                            ₹${Number(
                                order.discount || 0
                            ).toFixed(2)}

                        </strong>

                    </div>


                    <div class="bill-row">

                        <span>
                            GST
                        </span>

                        <strong>

                            ₹${Number(
                                order.gst || 0
                            ).toFixed(2)}

                        </strong>

                    </div>


                    <div class="bill-row">

                        <span>
                            Delivery
                        </span>

                        <strong>

                            ₹${Number(
                                order.delivery_charge || 0
                            ).toFixed(2)}

                        </strong>

                    </div>


                    <div class="bill-total">

                        <span>
                            Grand Total
                        </span>

                        <span>

                            ₹${Number(
                                order.total || 0
                            ).toFixed(2)}

                        </span>

                    </div>

                </div>


                <div class="payment-section">

                    <h3>
                        💳 Payment
                    </h3>


                    <div class="payment-info">


                        <div class="payment-method">

                            Method:
                            ${escapeHTML(
                                order.payment_method ||
                                "WhatsApp"
                            )}

                        </div>


                        <span
                            class="payment-status ${paymentClass}"
                        >

                            ${paymentStatus}

                        </span>


                        ${
                            paymentStatus !== "Paid"
                            ? `

                                <button
                                    class="mark-paid"
                                    onclick="markPaid(
                                        ${order.id}
                                    )"
                                >

                                    ✓ Mark Paid

                                </button>

                            `
                            : `

                                <strong>
                                    ✓ Payment Confirmed
                                </strong>

                            `
                        }

                    </div>

                </div>


                <div class="status-section">

                    <label>
                        Order Status:
                    </label>


                    <select
                        id="status-${order.id}"
                    >

                        ${getStatusOptions(
                            order.status
                        )}

                    </select>


                    <button
                        class="update-status"
                        onclick="updateOrderStatus(
                            ${order.id}
                        )"
                    >

                        Update Status

                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


// ======================================================
// STATUS OPTIONS
// ======================================================

function getStatusOptions(currentStatus) {

    const statuses = [

        "Pending",
        "Confirmed",
        "Preparing",
        "Ready",
        "Served",
        "Completed",
        "Cancelled"

    ];


    return statuses.map(
        function(status) {

            return `

                <option
                    value="${status}"
                    ${
                        status === currentStatus
                            ? "selected"
                            : ""
                    }
                >

                    ${status}

                </option>

            `;

        }
    ).join("");

}


// ======================================================
// UPDATE ORDER STATUS
// ======================================================

async function updateOrderStatus(orderId) {

    const select =
        document.getElementById(
            `status-${orderId}`
        );


    if (!select) {

        alert(
            "Status selector not found"
        );

        return;

    }


    const status =
        select.value;


    try {

        const response =
            await fetch(
                `${API}/admin/orders/${orderId}/status`,
                {

                    method: "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        status: status

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Failed to update status"
            );

            return;

        }


        alert(
            "Order status updated successfully!"
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "UPDATE STATUS ERROR:",
            error
        );


        alert(
            "Server error while updating status."
        );

    }

}


// ======================================================
// MARK PAYMENT AS PAID
// ======================================================

async function markPaid(orderId) {

    const confirmPayment =
        confirm(
            "Confirm that this WhatsApp payment has been received?"
        );


    if (!confirmPayment) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/admin/orders/${orderId}/payment-status`,
                {

                    method: "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        payment_status:
                            "Paid"

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Failed to update payment"
            );

            return;

        }


        alert(
            "Payment marked as Paid!"
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "PAYMENT ERROR:",
            error
        );


        alert(
            "Server error while updating payment."
        );

    }

}


// ======================================================
// FORMAT DATE
// ======================================================

function formatDate(date) {

    if (!date) {

        return "";

    }


    const parsedDate =
        new Date(
            date
        );


    if (isNaN(
        parsedDate.getTime()
    )) {

        return date;

    }


    return parsedDate.toLocaleString();

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text === null ||
        text === undefined
            ? ""
            : String(text);


    return div.innerHTML;

}


// ======================================================
// INITIAL LOAD
// ======================================================

loadOrders();


// Refresh every 5 seconds

setInterval(
    loadOrders,
    5000
);

</script>


</body>

</html>
