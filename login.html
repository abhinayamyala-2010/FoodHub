
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Login</title>

    <style>
        :root {
            --cafe-espresso: #3b2418;
            --cafe-coffee: #5a3825;
            --cafe-caramel: #b9783f;
            --cafe-gold: #d6a15d;
            --cafe-cream: #fff8ed;
            --cafe-beige: #f3e5d0;
            --cafe-latte: #ead4b7;
            --cafe-text: #2f211a;
            --cafe-white: #fffdf9;
            --cafe-shadow: 0 8px 24px rgba(59, 36, 24, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, "Times New Roman", serif;
            background: var(--cafe-cream);
            color: var(--cafe-text);
        }

        .box {
            background: var(--cafe-white);
            padding: 32px;
            width: 100%;
            max-width: 390px;
            border: 1px solid var(--cafe-latte);
            border-radius: 14px;
            box-shadow: var(--cafe-shadow);
        }

        h1 {
            text-align: center;
            color: var(--cafe-espresso);
            margin: 0 0 8px;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: var(--cafe-caramel);
            margin-bottom: 28px;
        }

        h2 {
            color: var(--cafe-espresso);
            text-align: center;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            background: var(--cafe-white);
            color: var(--cafe-text);
            border: 1px solid #d8b994;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--cafe-caramel);
            box-shadow: 0 0 0 3px rgba(185, 120, 63, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: var(--cafe-coffee);
            color: var(--cafe-cream);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(59, 36, 24, 0.16);
        }

        button:hover {
            background: var(--cafe-caramel);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            overflow-wrap: anywhere;
            margin-top: 16px;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
        }

        a {
            color: var(--cafe-coffee);
            font-weight: bold;
        }

        a:hover {
            color: var(--cafe-caramel);
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>FoodHub</h1>
        <p class="subtitle">Fresh food, happy mood!</p>

        <h2>Login</h2>

        <form id="loginForm">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

        <p class="back-link">
            <a href="index.html">Back to Home</a>
        </p>
    </div>

    <script>
        // Replace this with your actual deployed Render backend URL.
        const API_BASE_URL = "YOUR_RENDER_BACKEND_URL";

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                message.textContent = "Please enter your email and password.";
                return;
            }

            if (API_BASE_URL === "YOUR_RENDER_BACKEND_URL") {
                message.textContent =
                    "Backend URL is not configured yet. Please contact the developer.";
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";
            message.textContent = "";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/auth/login`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        data.message || "Login failed. Please check your details.";
                    return;
                }

                if (!data.user) {
                    message.textContent =
                        "Login response is missing user information.";
                    return;
                }

                localStorage.setItem(
                    "foodhubUser",
                    JSON.stringify(data.user)
                );

                message.textContent = "Login successful! Opening menu...";

                setTimeout(function () {
                    window.location.href = "menu.html";
                }, 500);

            } catch (error) {
                console.error("FoodHub login error:", error);

                message.textContent =
                    "Cannot connect to the server. Check your backend URL and deployment.";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
