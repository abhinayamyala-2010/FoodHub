<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodHub - Admin Reservations</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* ==============================
           HEADER
        ============================== */

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: #ff9800;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        header a:hover {
            color: #ff9800;
        }

        /* ==============================
           CONTAINER
        ============================== */

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
        }

        /* ==============================
           TITLE
        ============================== */

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            margin: 0 0 5px;
        }

        .page-title p {
            color: #666;
            margin: 0;
        }

        /* ==============================
           STAT CARDS
        ============================== */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 14px;
            color: #777;
        }

        .stat-card .number {
            margin-top: 8px;
            font-size: 30px;
            font-weight: bold;
        }

        .orange {
            color: #ff9800;
        }

        .green {
            color: #28a745;
        }

        .red {
            color: #dc3545;
        }

        .blue {
            color: #1976d2;
        }

        /* ==============================
           FILTER BOX
        ============================== */

        .filter-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.08);

            display: grid;

            grid-template-columns:
                2fr 1fr 1fr auto;

            gap: 15px;

            margin-bottom: 25px;
        }

        .filter-box input,
        .filter-box select {
            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;
        }

        .refresh-btn {
            border: none;

            padding: 12px 20px;

            border-radius: 7px;

            background: #ff9800;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #e68900;
        }

        /* ==============================
           TABLE
        ============================== */

        .table-container {
            background: white;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.08);

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: white;
            padding: 14px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }

        tr:hover td {
            background: #fafafa;
        }

        /* ==============================
           STATUS
        ============================== */

        .status {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }

        .status-booked {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        /* ==============================
           CANCEL BUTTON
        ============================== */

        .cancel-btn {
            border: none;

            background: #dc3545;

            color: white;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #c82333;
        }

        .disabled-btn {
            background: #aaa;

            color: white;

            padding: 8px 12px;

            border-radius: 6px;
        }

        /* ==============================
           EMPTY
        ============================== */

        .empty {
            text-align: center;

            padding: 40px;

            color: #777;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading {
            text-align: center;

            padding: 40px;

            color: #777;

            font-size: 16px;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (
            max-width: 900px
        ) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .filter-box {
                grid-template-columns:
                    1fr;
            }

            header {
                flex-direction: column;
                gap: 12px;
            }

        }

    </style>


<style id="foodhub-cafe-theme">
:root{--cafe-espresso:#3b2418;--cafe-coffee:#5a3825;--cafe-caramel:#b9783f;--cafe-gold:#d6a15d;--cafe-cream:#fff8ed;--cafe-beige:#f3e5d0;--cafe-latte:#ead4b7;--cafe-text:#2f211a;--cafe-white:#fffdf9;--cafe-shadow:0 8px 24px rgba(59,36,24,.12)}
html,body{background:var(--cafe-cream)!important;color:var(--cafe-text)!important}
body{font-family:Georgia,'Times New Roman',serif!important}
header,.header,.navbar,nav,.nav,.topbar,.sidebar{background:var(--cafe-espresso)!important;color:#fff8ed!important}
header a,.header a,.navbar a,nav a,.nav a,.topbar a,.sidebar a{color:#fff8ed!important}
h1,h2,h3,h4,h5,h6{color:var(--cafe-espresso)!important}
button,.btn,.button,input[type=submit],input[type=button]{background:var(--cafe-coffee)!important;color:#fff8ed!important;border-color:var(--cafe-coffee)!important;border-radius:10px!important;box-shadow:0 3px 8px rgba(59,36,24,.16)!important}
button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{background:var(--cafe-caramel)!important;border-color:var(--cafe-caramel)!important}
a{color:var(--cafe-coffee)}
a:hover{color:var(--cafe-caramel)}
.card,.food-card,.menu-card,.product-card,.order-card,.stat-card,.box,.panel,.container-card,.admin-card,.reservation-card,.review-card,.table-card,.modal-content{background:var(--cafe-white)!important;border-color:var(--cafe-latte)!important;box-shadow:var(--cafe-shadow)!important;border-radius:14px!important}
input,select,textarea{background:#fffdf9!important;color:var(--cafe-text)!important;border:1px solid #d8b994!important;border-radius:8px!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--cafe-caramel)!important;box-shadow:0 0 0 3px rgba(185,120,63,.15)!important}
th{background:var(--cafe-coffee)!important;color:#fff8ed!important}
tr:nth-child(even){background:#fbf1e2!important}
.badge,.status,.tag,.category{background:var(--cafe-beige)!important;color:var(--cafe-espresso)!important}
.logo,.brand{color:var(--cafe-gold)!important}
footer{background:var(--cafe-espresso)!important;color:#fff8ed!important}
img{border-radius:10px}
hr{border-color:var(--cafe-latte)!important}
.cafe-theme-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--cafe-beige);color:var(--cafe-espresso);font-size:13px;font-weight:700;letter-spacing:.4px}
</style>
</head>


<body>


<!-- =====================================
     HEADER
====================================== -->

<header>

    <h1>
        🍴 FoodHub Admin
    </h1>

    <nav>

        <a href="admin-dashboard.html">
            Dashboard
        </a>

        <a href="admin-reservations.html">
            Reservations
        </a>

        <a href="index.html">
            Website
        </a>

    </nav>

</header>


<!-- =====================================
     MAIN
====================================== -->

<div class="container">


    <div class="page-title">

        <h2>
            📅 Reservation Management
        </h2>

        <p>
            Manage customer table reservations
        </p>

    </div>


    <!-- =====================================
         STATISTICS
    ====================================== -->

    <div class="stats">


        <div class="stat-card">

            <h3>
                Total Reservations
            </h3>

            <div
                id="totalReservations"
                class="number orange"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Active Bookings
            </h3>

            <div
                id="bookedReservations"
                class="number green"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Cancelled
            </h3>

            <div
                id="cancelledReservations"
                class="number red"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Today's Bookings
            </h3>

            <div
                id="todayReservations"
                class="number blue"
            >
                0
            </div>

        </div>


    </div>


    <!-- =====================================
         FILTERS
    ====================================== -->

    <div class="filter-box">


        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search customer, email or table..."
        >


        <input
            type="date"
            id="dateFilter"
        >


        <select
            id="statusFilter"
        >

            <option value="">
                All Status
            </option>

            <option value="Booked">
                Booked
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>


        <button
            class="refresh-btn"
            onclick="loadReservations()"
        >

            🔄 Refresh

        </button>


    </div>


    <!-- =====================================
         RESERVATIONS TABLE
    ====================================== -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Table
                    </th>

                    <th>
                        Seats
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Time
                    </th>

                    <th>
                        Guests
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody
                id="reservationTable"
            >

                <tr>

                    <td
                        colspan="10"
                        class="loading"
                    >

                        Loading reservations...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>



<script>


// ==========================================
// API
// ==========================================

const API = "";


// ==========================================
// RESERVATION DATA
// ==========================================

let allReservations = [];


// ==========================================
// LOAD RESERVATIONS
// ==========================================

async function loadReservations() {

    const table =
        document.getElementById(
            "reservationTable"
        );


    table.innerHTML = `

        <tr>

            <td
                colspan="10"
                class="loading"
            >

                🔄 Loading reservations...

            </td>

        </tr>

    `;


    try {

        const response =
            await fetch(
                API +
                "/api/reservations/admin/all"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load reservations"
            );

        }


        allReservations =
            data;


        updateStatistics();


        applyFilters();


    } catch (error) {

        console.error(error);


        table.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty"
                >

                    ❌ ${error.message}

                </td>

            </tr>

        `;

    }

}


// ==========================================
// UPDATE STATISTICS
// ==========================================

async function updateStatistics() {

    try {

        const response =
            await fetch(
                API +
                "/api/reservations/admin/summary"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load statistics"
            );

        }


        document
            .getElementById(
                "totalReservations"
            )
            .textContent =
                data.totalReservations;


        document
            .getElementById(
                "bookedReservations"
            )
            .textContent =
                data.bookedReservations;


        document
            .getElementById(
                "cancelledReservations"
            )
            .textContent =
                data.cancelledReservations;


        document
            .getElementById(
                "todayReservations"
            )
            .textContent =
                data.todayReservations;


    } catch (error) {

        console.error(
            error
        );

    }

}


// ==========================================
// APPLY FILTERS
// ==========================================

function applyFilters() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const date =
        document
            .getElementById(
                "dateFilter"
            )
            .value;


    const status =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const filtered =
        allReservations.filter(
            reservation => {


                // ----------------------------
                // SEARCH
                // ----------------------------

                const searchText =

                    (
                        reservation.customer_name ||
                        ""
                    )

                    .toLowerCase()

                    +

                    " "

                    +

                    (
                        reservation.email ||
                        ""
                    )

                    .toLowerCase()

                    +

                    " "

                    +

                    String(
                        reservation.table_number ||
                        ""
                    );


                const matchesSearch =

                    !search ||

                    searchText.includes(
                        search
                    );


                // ----------------------------
                // DATE
                // ----------------------------

                const matchesDate =

                    !date ||

                    reservation.reservation_date ===
                    date;


                // ----------------------------
                // STATUS
                // ----------------------------

                const matchesStatus =

                    !status ||

                    reservation.status ===
                    status;


                return (
                    matchesSearch &&
                    matchesDate &&
                    matchesStatus
                );

            }
        );


    displayReservations(
        filtered
    );

}


// ==========================================
// DISPLAY RESERVATIONS
// ==========================================

function displayReservations(
    reservations
) {

    const table =
        document.getElementById(
            "reservationTable"
        );


    table.innerHTML = "";


    if (
        reservations.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty"
                >

                    📭 No reservations found.

                </td>

            </tr>

        `;

        return;

    }


    reservations.forEach(
        reservation => {


            const row =
                document.createElement(
                    "tr"
                );


            const statusClass =

                reservation.status ===
                "Booked"

                ? "status-booked"

                : "status-cancelled";


            let action = "";


            if (
                reservation.status ===
                "Booked"
            ) {

                action = `

                    <button
                        class="cancel-btn"
                        onclick="cancelReservation(${reservation.id})"
                    >

                        Cancel

                    </button>

                `;

            } else {

                action = `

                    <span
                        class="disabled-btn"
                    >

                        Cancelled

                    </span>

                `;

            }


            row.innerHTML = `

                <td>
                    #${reservation.id}
                </td>

                <td>
                    ${escapeHTML(
                        reservation.customer_name ||
                        "Unknown"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        reservation.email ||
                        "-"
                    )}
                </td>

                <td>
                    🪑 Table
                    ${reservation.table_number}
                </td>

                <td>
                    ${reservation.seats}
                </td>

                <td>
                    ${reservation.reservation_date}
                </td>

                <td>
                    ${reservation.reservation_time}
                </td>

                <td>
                    👥 ${reservation.guests}
                </td>

                <td>

                    <span
                        class="status ${statusClass}"
                    >

                        ${reservation.status}

                    </span>

                </td>

                <td>
                    ${action}
                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


// ==========================================
// CANCEL RESERVATION
// ==========================================

async function cancelReservation(
    reservationId
) {

    const confirmed =
        confirm(
            "Are you sure you want to cancel reservation #" +
            reservationId +
            "?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(

                API +
                "/api/reservations/" +
                reservationId,

                {

                    method: "DELETE"

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to cancel reservation"
            );

        }


        alert(
            "Reservation cancelled successfully."
        );


        loadReservations();


    } catch (error) {

        console.error(
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ==========================================
// SEARCH EVENT
// ==========================================

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        applyFilters
    );


// ==========================================
// DATE FILTER
// ==========================================

document
    .getElementById(
        "dateFilter"
    )
    .addEventListener(
        "change",
        applyFilters
    );


// ==========================================
// STATUS FILTER
// ==========================================

document
    .getElementById(
        "statusFilter"
    )
    .addEventListener(
        "change",
        applyFilters
    );


// ==========================================
// INITIAL LOAD
// ==========================================

loadReservations();


</script>


</body>

</html>
