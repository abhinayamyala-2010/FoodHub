<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodHub - Table Reservation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: #ff9800;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        nav a:hover {
            color: #ff9800;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .table-grid {
            display: grid;
            grid-template-columns:
                repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .table-card {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: 0.2s;
        }

        .table-card:hover {
            border-color: #ff9800;
            transform: translateY(-2px);
        }

        .table-card.selected {
            border-color: #ff9800;
            background: #fff3e0;
        }

        .table-icon {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .table-number {
            font-weight: bold;
            font-size: 18px;
        }

        .table-seats {
            color: #666;
            margin-top: 5px;
        }

        .reserve-btn {
            margin-top: 25px;
            padding: 14px 28px;
            border: none;
            border-radius: 7px;
            background: #ff9800;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reserve-btn:hover {
            background: #e68900;
        }

        .reserve-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-top: 15px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .info {
            background: #e3f2fd;
            color: #0d47a1;
        }

        .reservation-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .reservation-item strong {
            color: #333;
        }

        .cancel-btn {
            margin-top: 10px;
            padding: 9px 15px;
            border: none;
            border-radius: 6px;
            background: #dc3545;
            color: white;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #c82333;
        }

        .status-booked {
            color: green;
            font-weight: bold;
        }

        .status-cancelled {
            color: red;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            header {
                flex-direction: column;
                gap: 12px;
            }

        }

    </style>


<style id="foodhub-cafe-theme">
:root{--cafe-espresso:#3b2418;--cafe-coffee:#5a3825;--cafe-caramel:#b9783f;--cafe-gold:#d6a15d;--cafe-cream:#fff8ed;--cafe-beige:#f3e5d0;--cafe-latte:#ead4b7;--cafe-text:#2f211a;--cafe-white:#fffdf9;--cafe-shadow:0 8px 24px rgba(59,36,24,.12)}
html,body{background:var(--cafe-cream)!important;color:var(--cafe-text)!important}
body{font-family:Georgia,'Times New Roman',serif!important}
header,.header,.navbar,nav,.nav,.topbar,.sidebar{background:var(--cafe-espresso)!important;color:#fff8ed!important}
header a,.header a,.navbar a,nav a,.nav a,.topbar a,.sidebar a{color:#fff8ed!important}
h1,h2,h3,h4,h5,h6{color:var(--cafe-espresso)!important}
button,.btn,.button,input[type=submit],input[type=button]{background:var(--cafe-coffee)!important;color:#fff8ed!important;border-color:var(--cafe-coffee)!important;border-radius:10px!important;box-shadow:0 3px 8px rgba(59,36,24,.16)!important}
button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{background:var(--cafe-caramel)!important;border-color:var(--cafe-caramel)!important}
a{color:var(--cafe-coffee)}
a:hover{color:var(--cafe-caramel)}
.card,.food-card,.menu-card,.product-card,.order-card,.stat-card,.box,.panel,.container-card,.admin-card,.reservation-card,.review-card,.table-card,.modal-content{background:var(--cafe-white)!important;border-color:var(--cafe-latte)!important;box-shadow:var(--cafe-shadow)!important;border-radius:14px!important}
input,select,textarea{background:#fffdf9!important;color:var(--cafe-text)!important;border:1px solid #d8b994!important;border-radius:8px!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--cafe-caramel)!important;box-shadow:0 0 0 3px rgba(185,120,63,.15)!important}
th{background:var(--cafe-coffee)!important;color:#fff8ed!important}
tr:nth-child(even){background:#fbf1e2!important}
.badge,.status,.tag,.category{background:var(--cafe-beige)!important;color:var(--cafe-espresso)!important}
.logo,.brand{color:var(--cafe-gold)!important}
footer{background:var(--cafe-espresso)!important;color:#fff8ed!important}
img{border-radius:10px}
hr{border-color:var(--cafe-latte)!important}
.cafe-theme-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--cafe-beige);color:var(--cafe-espresso);font-size:13px;font-weight:700;letter-spacing:.4px}
</style>
</head>


<body>


<header>

    <h1>🍴 FoodHub</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="menu.html">
            Menu
        </a>

        <a href="cart.html">
            Cart
        </a>

        <a href="orders.html">
            Orders
        </a>

    </nav>

</header>


<div class="container">


    <!-- =====================================
         RESERVATION FORM
    ====================================== -->

    <div class="card">

        <h2>
            🍽️ Reserve a Table
        </h2>


        <div class="form-grid">


            <!-- DATE -->

            <div class="form-group">

                <label>
                    Reservation Date
                </label>

                <input
                    type="date"
                    id="reservationDate"
                >

            </div>


            <!-- TIME -->

            <div class="form-group">

                <label>
                    Reservation Time
                </label>

                <input
                    type="time"
                    id="reservationTime"
                >

            </div>


            <!-- GUESTS -->

            <div class="form-group">

                <label>
                    Number of Guests
                </label>

                <input
                    type="number"
                    id="guests"
                    min="1"
                    value="2"
                >

            </div>


        </div>


        <div
            id="message"
            class="message"
        ></div>


        <h3>
            Available Tables
        </h3>


        <div
            id="tableGrid"
            class="table-grid"
        >

            <div class="empty">

                Select date and time
                to see available tables.

            </div>

        </div>


        <button
            id="reserveButton"
            class="reserve-btn"
            disabled
        >

            Reserve Selected Table

        </button>

    </div>



    <!-- =====================================
         MY RESERVATIONS
    ====================================== -->

    <div class="card">

        <h2>
            📋 My Reservations
        </h2>


        <div
            id="myReservations"
        >

            <div class="empty">

                Loading reservations...

            </div>

        </div>

    </div>


</div>



<script>


// ==========================================
// API
// ==========================================

const API = "";


// ==========================================
// USER
// ==========================================

const user =
    JSON.parse(
        localStorage.getItem(
            "foodhubUser"
        )
    );


if (!user) {

    alert(
        "Please login to reserve a table."
    );

    window.location.href =
        "login.html";

}


// ==========================================
// VARIABLES
// ==========================================

let selectedTable = null;

let availableTables = [];


// ==========================================
// ELEMENTS
// ==========================================

const dateInput =
    document.getElementById(
        "reservationDate"
    );

const timeInput =
    document.getElementById(
        "reservationTime"
    );

const guestsInput =
    document.getElementById(
        "guests"
    );

const tableGrid =
    document.getElementById(
        "tableGrid"
    );

const reserveButton =
    document.getElementById(
        "reserveButton"
    );

const message =
    document.getElementById(
        "message"
    );


// ==========================================
// SET MINIMUM DATE
// ==========================================

const today =
    new Date();


const todayString =
    today.toISOString()
        .split("T")[0];


dateInput.min =
    todayString;


// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " +
        type;

    message.style.display =
        "block";

}


// ==========================================
// HIDE MESSAGE
// ==========================================

function hideMessage() {

    message.style.display =
        "none";

}


// ==========================================
// LOAD AVAILABLE TABLES
// ==========================================

async function loadTables() {

    selectedTable =
        null;

    reserveButton.disabled =
        true;


    const date =
        dateInput.value;

    const time =
        timeInput.value;

    const guests =
        Number(
            guestsInput.value
        );


    // --------------------------------------
    // BASIC VALIDATION
    // --------------------------------------

    if (!date || !time) {

        tableGrid.innerHTML = `

            <div class="empty">

                Select date and time
                to see available tables.

            </div>

        `;

        return;

    }


    if (
        !guests ||
        guests < 1
    ) {

        tableGrid.innerHTML = `

            <div class="empty">

                Enter a valid number of guests.

            </div>

        `;

        return;

    }


    tableGrid.innerHTML = `

        <div class="empty">

            🔄 Checking table availability...

        </div>

    `;


    hideMessage();


    try {

        const url =

            API +

            "/api/reservations/available-tables-by-time" +

            "?reservation_date=" +

            encodeURIComponent(
                date
            ) +

            "&reservation_time=" +

            encodeURIComponent(
                time
            ) +

            "&guests=" +

            encodeURIComponent(
                guests
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load tables"
            );

        }


        availableTables =
            data;


        displayTables(
            data
        );


    } catch (error) {

        console.error(
            error
        );


        tableGrid.innerHTML = `

            <div class="empty">

                ❌ ${error.message}

            </div>

        `;

    }

}


// ==========================================
// DISPLAY TABLES
// ==========================================

function displayTables(
    tables
) {

    tableGrid.innerHTML = "";


    if (
        !tables ||
        tables.length === 0
    ) {

        tableGrid.innerHTML = `

            <div class="empty">

                😔 No tables are available
                for the selected time.

            </div>

        `;

        return;

    }


    tables.forEach(
        table => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "table-card";


            card.innerHTML = `

                <div class="table-icon">
                    🪑
                </div>

                <div class="table-number">

                    Table ${table.table_number}

                </div>

                <div class="table-seats">

                    ${table.seats} Seats

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    selectTable(
                        table,
                        card
                    );

                }
            );


            tableGrid.appendChild(
                card
            );

        }
    );

}


// ==========================================
// SELECT TABLE
// ==========================================

function selectTable(
    table,
    card
) {

    document
        .querySelectorAll(
            ".table-card"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "selected"
                );

            }
        );


    card.classList.add(
        "selected"
    );


    selectedTable =
        table;


    reserveButton.disabled =
        false;

}


// ==========================================
// RESERVE TABLE
// ==========================================

reserveButton.addEventListener(
    "click",
    reserveTable
);


async function reserveTable() {

    if (!selectedTable) {

        showMessage(
            "Please select a table.",
            "error"
        );

        return;

    }


    const date =
        dateInput.value;

    const time =
        timeInput.value;

    const guests =
        Number(
            guestsInput.value
        );


    if (!date || !time) {

        showMessage(
            "Please select date and time.",
            "error"
        );

        return;

    }


    reserveButton.disabled =
        true;

    reserveButton.textContent =
        "Reserving...";


    try {

        const response =
            await fetch(
                API +
                "/api/reservations",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            user_id:
                                user.id,

                            table_id:
                                selectedTable.id,

                            reservation_date:
                                date,

                            reservation_time:
                                time,

                            guests:
                                guests

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Reservation failed"
            );

        }


        showMessage(

            "✅ " +
            data.message +
            " Reservation ID: " +
            data.reservationId,

            "success"

        );


        selectedTable =
            null;


        reserveButton.disabled =
            true;


        reserveButton.textContent =
            "Reserve Selected Table";


        await loadTables();


        await loadMyReservations();


    } catch (error) {

        console.error(
            error
        );


        showMessage(
            "❌ " +
            error.message,
            "error"
        );


        reserveButton.disabled =
            false;

        reserveButton.textContent =
            "Reserve Selected Table";

    }

}


// ==========================================
// LOAD MY RESERVATIONS
// ==========================================

async function loadMyReservations() {

    const container =
        document.getElementById(
            "myReservations"
        );


    try {

        const response =
            await fetch(

                API +
                "/api/reservations/user/" +
                user.id

            );


        const reservations =
            await response.json();


        if (!response.ok) {

            throw new Error(
                reservations.message ||
                "Failed to load reservations"
            );

        }


        if (
            reservations.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    You don't have any reservations yet.

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        reservations.forEach(
            reservation => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "reservation-item";


                const statusClass =

                    reservation.status ===
                    "Booked"

                    ? "status-booked"

                    : "status-cancelled";


                item.innerHTML = `

                    <strong>
                        Table ${reservation.table_number}
                    </strong>

                    <br>

                    📅
                    ${reservation.reservation_date}

                    <br>

                    🕐
                    ${reservation.reservation_time}

                    <br>

                    👥
                    ${reservation.guests}
                    Guests

                    <br>

                    🪑
                    ${reservation.seats}
                    Seats

                    <br>

                    Status:
                    <span class="${statusClass}">

                        ${reservation.status}

                    </span>

                `;


                if (
                    reservation.status ===
                    "Booked"
                ) {

                    const cancelButton =
                        document.createElement(
                            "button"
                        );


                    cancelButton.className =
                        "cancel-btn";


                    cancelButton.textContent =
                        "Cancel Reservation";


                    cancelButton.addEventListener(
                        "click",
                        () => {

                            cancelReservation(
                                reservation.id
                            );

                        }
                    );


                    item.appendChild(
                        cancelButton
                    );

                }


                container.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="empty">

                ❌ ${error.message}

            </div>

        `;

    }

}


// ==========================================
// CANCEL RESERVATION
// ==========================================

async function cancelReservation(
    reservationId
) {

    const confirmCancel =
        confirm(
            "Are you sure you want to cancel this reservation?"
        );


    if (!confirmCancel) {

        return;

    }


    try {

        const response =
            await fetch(

                API +
                "/api/reservations/" +
                reservationId,

                {

                    method: "DELETE"

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to cancel reservation"
            );

        }


        alert(
            "Reservation cancelled successfully."
        );


        loadMyReservations();


        loadTables();


    } catch (error) {

        console.error(
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }

}


// ==========================================
// DATE CHANGE
// ==========================================

dateInput.addEventListener(
    "change",
    loadTables
);


// ==========================================
// TIME CHANGE
// ==========================================

timeInput.addEventListener(
    "change",
    loadTables
);


// ==========================================
// GUEST CHANGE
// ==========================================

guestsInput.addEventListener(
    "input",
    loadTables
);


// ==========================================
// INITIAL LOAD
// ==========================================

loadMyReservations();


</script>


</body>

</html>
