        padding: 15px;

    .remove-btn {
        background: #dc3545;
        color: white;
        margin-top: 10px;

    .coupon-message {

        font-weight: bold;
    }

        color: green;

    .summary-item {
        display: flex;

        text-decoration: none;
        border-radius: 7px;
        font-weight: bold;

    .empty {
        color: #777;
        text-align: center;
        padding: 20px;
    }

    @media(max-width: 800px) {

        .container {
            grid-template-columns: 1fr;
        }

        nav {
            flex-direction: column;
            gap: 15px;
        }

        nav a {
            margin-left: 10px;
        }

    }

</style>

<script>

let cart = [];

let foods = [];

let appliedCoupon = null;

let discountAmount = 0;


const WHATSAPP_NUMBER =
    "919063633222";


/* ==========================================
   CHECK LOGIN
========================================== */

const user =
    JSON.parse(
        localStorage.getItem("foodhubUser")
    );


if (!user) {

    alert(
        "Please login before checkout."
    );

    window.location.href =
        "login.html";

}


/* ==========================================
   GET CART
========================================== */

const savedCart =
    JSON.parse(
        localStorage.getItem("foodhubCart")
    ) || [];

cart = savedCart;


/* ==========================================
   LOAD CHECKOUT
========================================== */

async function loadCheckout() {

    try {

        const response =
            await fetch("/api/foods");

        if (!response.ok) {

            throw new Error(
                "Failed to load foods"
            );

        }

        foods =
            await response.json();


        /*
           Load the logged-in name initially.
           Customer can edit it.
        */

        document.getElementById(
            "customerName"
        ).value =
            user.name || "";


        renderItems();

        calculateTotal();

    } catch (error) {

        console.error(error);

        alert(
            "Failed to load checkout."
        );

    }

}


/* ==========================================
   RENDER ITEMS
========================================== */

function renderItems() {

    const container =
        document.getElementById(
            "itemsContainer"
        );

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Your cart is empty.
            </div>
        `;

        return;

    }


    cart.forEach(item => {

        const food =
            foods.find(
                f =>
                    Number(f.id) ===
                    Number(item.food_id)
            );

        if (!food) {
            return;
        }

        const quantity =
            Number(item.quantity);

        const itemTotal =
            Number(food.price) *
            quantity;

        const div =
            document.createElement("div");

        div.className =
            "summary-item";

        div.innerHTML = `
            <span>
                ${food.name} × ${quantity}
            </span>

            <span>
                ₹${itemTotal.toFixed(2)}
            </span>
        `;

        container.appendChild(div);

    });

}


/* ==========================================
   GET SUBTOTAL
========================================== */

function getSubtotal() {

    let subtotal = 0;

    cart.forEach(item => {

        const food =
            foods.find(
                f =>
                    Number(f.id) ===
                    Number(item.food_id)
            );

        if (!food) {
            return;
        }

        subtotal +=
            Number(food.price) *
            Number(item.quantity);

    });

    return subtotal;

}


/* ==========================================
   CALCULATE TOTAL
========================================== */

function calculateTotal() {

    const subtotal =
        getSubtotal();

    const taxableAmount =
        Math.max(
            subtotal - discountAmount,
            0
        );

    const gst =
        taxableAmount * 0.05;

    const orderType =
        document.getElementById(
            "orderType"
        ).value;

    let deliveryCharge = 0;


    if (
        orderType !== "Takeaway" &&
        subtotal < 500
    ) {

        deliveryCharge = 40;

    }


    const total =
        taxableAmount +
        gst +
        deliveryCharge;


    document.getElementById(
        "subtotal"
    ).textContent =
        "₹" +
        subtotal.toFixed(2);


    document.getElementById(
        "gst"
    ).textContent =
        "₹" +
        gst.toFixed(2);


    document.getElementById(
        "delivery"
    ).textContent =
        "₹" +
        deliveryCharge.toFixed(2);


    document.getElementById(
        "total"
    ).textContent =
        "₹" +
        total.toFixed(2);


    if (discountAmount > 0) {

        document.getElementById(
            "discountRow"
        ).style.display =
            "flex";

        document.getElementById(
            "discount"
        ).textContent =
            "-₹" +
            discountAmount.toFixed(2);

    } else {

        document.getElementById(
            "discountRow"
        ).style.display =
            "none";

    }

}


/* ==========================================
   APPLY COUPON
========================================== */

async function applyCoupon() {

    const code =
        document.getElementById(
            "couponCode"
        ).value.trim();

    const message =
        document.getElementById(
            "couponMessage"
        );

    if (!code) {

        message.textContent =
            "Enter a coupon code.";

        message.className =
            "coupon-message error";

        return;

    }


    const subtotal =
        getSubtotal();

    if (subtotal <= 0) {

        message.textContent =
            "Your cart is empty.";

        message.className =
            "coupon-message error";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/coupons/validate",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        code: code,
                        subtotal: subtotal
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            message.textContent =
                data.message ||
                "Invalid coupon.";

            message.className =
                "coupon-message error";

            return;

        }


        appliedCoupon =
            data.coupon;

        discountAmount =
            Number(data.discount);


        message.textContent =
            `Coupon ${appliedCoupon.code} applied! You saved ₹${discountAmount.toFixed(2)}.`;

        message.className =
            "coupon-message success";


        document.getElementById(
            "removeCouponBtn"
        ).style.display =
            "block";


        document.getElementById(
            "couponCode"
        ).disabled =
            true;


        calculateTotal();

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to apply coupon.";

        message.className =
            "coupon-message error";

    }

}


/* ==========================================
   REMOVE COUPON
========================================== */

function removeCoupon() {

    appliedCoupon = null;

    discountAmount = 0;


    document.getElementById(
        "couponCode"
    ).value = "";


    document.getElementById(
        "couponCode"
    ).disabled =
        false;


    document.getElementById(
        "removeCouponBtn"
    ).style.display =
        "none";


    const message =
        document.getElementById(
            "couponMessage"
        );

    message.textContent = "";

    message.className =
        "coupon-message";


    calculateTotal();

}


/* ==========================================
   PLACE ORDER
========================================== */

async function placeOrder() {

    if (!cart.length) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();


    const customerPhone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const customerAddress =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    const orderType =
        document.getElementById(
            "orderType"
        ).value;


    /* ======================================
       VALIDATION
    ====================================== */

    if (!customerName) {

        alert(
            "Please enter your name."
        );

        return;

    }


    if (!customerPhone) {

        alert(
            "Please enter your phone number."
        );

        return;

    }


    if (
        orderType === "Delivery" &&
        !customerAddress
    ) {

        alert(
            "Please enter your delivery address."
        );

        return;

    }


    /* ======================================
       ORDER DATA
    ====================================== */

    const orderData = {

        user_id:
            Number(user.id),

        customer_name:
            customerName,

        items:
            cart.map(item => ({

                food_id:
                    Number(item.food_id),

                quantity:
                    Number(item.quantity)

            })),

        customer_phone:
            customerPhone,

        delivery_address:
            customerAddress,

        order_type:
            orderType,

        coupon_code:
            appliedCoupon
                ? appliedCoupon.code
                : "",

        discount:
            discountAmount

    };


    try {

        const response =
            await fetch(
                "/api/orders",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(orderData)

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Failed to place order."
            );

            return;

        }


        /* ==================================
           CREATE WHATSAPP MESSAGE
        =================================== */

        let message =
`🍽️ *FoodHub Order*

*Order ID:* #${data.orderId}
*Customer:* ${customerName}
*Phone:* ${customerPhone}
*Order Type:* ${orderType}
`;


        /* ==================================
           ADDRESS
        =================================== */

        if (
            orderType === "Delivery"
        ) {

            message +=
`*Address:* ${customerAddress}
`;

        }


        /* ==================================
           ITEMS
        =================================== */

        message +=
`
*Items:*
`;


        cart.forEach(item => {

            const food =
                foods.find(
                    f =>
                        Number(f.id) ===
                        Number(item.food_id)
                );


            if (!food) {
                return;
            }


            const itemTotal =
                Number(food.price) *
                Number(item.quantity);


            message +=
`• ${food.name} × ${item.quantity} = ₹${itemTotal.toFixed(2)}
`;

        });


        /* ==================================
           PRICE DETAILS
        =================================== */

        message +=
`
*Subtotal:* ₹${Number(
            data.subtotal
        ).toFixed(2)}
`;


        if (
            Number(data.discount) > 0
        ) {

            message +=
`*Coupon:* ${data.couponCode}
`;

            message +=
`*Discount:* -₹${Number(
                data.discount
            ).toFixed(2)}
`;

        }


        message +=
`*GST:* ₹${Number(
            data.gst
        ).toFixed(2)}
`;


        message +=
`*Delivery:* ₹${Number(
            data.deliveryCharge
        ).toFixed(2)}
`;


        message +=
`*Total:* ₹${Number(
            data.total
        ).toFixed(2)}
`;


        message +=
`*Payment:* WhatsApp
`;


        message +=
`*Payment Status:* Pending
`;


        /* ==================================
           ENCODE WHATSAPP
        =================================== */

        const whatsappUrl =
            "https://wa.me/" +
            WHATSAPP_NUMBER +
            "?text=" +
            encodeURIComponent(message);


        /* ==================================
           CLEAR CART
        =================================== */

        localStorage.removeItem(
            "foodhubCart"
        );


        /* ==================================
           HIDE CHECKOUT
        =================================== */

        document.getElementById(
            "checkoutContainer"
        ).style.display =
            "none";


        /* ==================================
           SHOW SUCCESS
        ================================== */

        document.getElementById(
            "successContainer"
        ).style.display =
            "grid";


        document.getElementById(
            "successMessage"
        ).innerHTML = `

            <strong>
                Order #${data.orderId}
            </strong>

            has been placed successfully.

            <br><br>

            Customer:

            <strong>
                ${customerName}
            </strong>

            <br><br>

            Total Amount:

            <strong>
                ₹${Number(
                    data.total
                ).toFixed(2)}
            </strong>

            <br><br>

            Payment Status:

            <strong>
                Pending
            </strong>

        `;


        document.getElementById(
            "whatsappLink"
        ).href =
            whatsappUrl;


    } catch (error) {

        console.error(error);

        alert(
            "Server error. Please try again."
        );

    }

}


/* ==========================================
   ORDER TYPE CHANGE
========================================== */

document.getElementById(
    "orderType"
).addEventListener(
    "change",
    calculateTotal
);


/* ==========================================
   START
========================================== */

loadCheckout();

</script>
