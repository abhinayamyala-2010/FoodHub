<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodHub - Table Management</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        /* ==============================
           HEADER
        ============================== */

        header {
            background: #111827;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 24px;
        }

        header span {
            color: #d1d5db;
            font-size: 14px;
        }


        /* ==============================
           CONTAINER
        ============================== */

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }


        /* ==============================
           TOP BAR
        ============================== */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            gap: 15px;

            flex-wrap: wrap;
        }


        .top-bar h2 {
            font-size: 26px;
        }


        button {

            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;
        }


        .refresh-btn {

            background: #2563eb;

            color: white;
        }


        .refresh-btn:hover {
            background: #1d4ed8;
        }


        .add-btn {

            background: #16a34a;

            color: white;
        }


        .add-btn:hover {
            background: #15803d;
        }


        /* ==============================
           STATS
        ============================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }


        .stat-card {

            background: white;

            padding: 22px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.07);
        }


        .stat-card h3 {

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 10px;
        }


        .stat-card p {

            font-size: 30px;

            font-weight: bold;
        }


        .total {
            border-left: 5px solid #2563eb;
        }


        .available {
            border-left: 5px solid #16a34a;
        }


        .reserved {
            border-left: 5px solid #f59e0b;
        }


        .occupied {
            border-left: 5px solid #dc2626;
        }


        .bookings {
            border-left: 5px solid #7c3aed;
        }


        /* ==============================
           TABLE
        ============================== */

        .table-container {

            background: white;

            border-radius: 12px;

            overflow-x: auto;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.07);
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1000px;
        }


        th {

            background: #111827;

            color: white;

            padding: 15px;

            text-align: left;

            font-size: 14px;
        }


        td {

            padding: 14px 15px;

            border-bottom: 1px solid #e5e7eb;

            font-size: 14px;
        }


        tr:hover {
            background: #f9fafb;
        }


        /* ==============================
           STATUS
        ============================== */

        .status {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }


        .status-available {

            background: #dcfce7;

            color: #166534;
        }


        .status-occupied {

            background: #fee2e2;

            color: #991b1b;
        }


        .status-reserved {

            background: #fef3c7;

            color: #92400e;
        }


        .no-reservation {

            color: #6b7280;

            font-size: 13px;
        }


        .customer {

            font-weight: bold;

            color: #111827;
        }


        .reservation-info {

            font-size: 13px;

            line-height: 1.7;
        }


        /* ==============================
           ACTION BUTTONS
        ============================== */

        .actions {

            display: flex;

            gap: 7px;

            flex-wrap: wrap;
        }


        .edit-btn {

            background: #2563eb;

            color: white;
        }


        .status-btn {

            background: #f59e0b;

            color: white;
        }


        .delete-btn {

            background: #dc2626;

            color: white;
        }


        .edit-btn:hover {
            background: #1d4ed8;
        }


        .status-btn:hover {
            background: #d97706;
        }


        .delete-btn:hover {
            background: #b91c1c;
        }


        /* ==============================
           MODAL
        ============================== */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.55);

            justify-content: center;

            align-items: center;

            z-index: 100;
        }


        .modal-box {

            background: white;

            width: 420px;

            max-width: 90%;

            padding: 25px;

            border-radius: 14px;
        }


        .modal-box h2 {

            margin-bottom: 20px;
        }


        .form-group {

            margin-bottom: 16px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;
        }


        .form-group input,

        .form-group select {

            width: 100%;

            padding: 11px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;
        }


        .modal-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;
        }


        .cancel-btn {

            background: #6b7280;

            color: white;
        }


        .save-btn {

            background: #16a34a;

            color: white;
        }


        /* ==============================
           EMPTY
        ============================== */

        .empty {

            text-align: center;

            padding: 40px;

            color: #6b7280;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 1100px) {

            .stats {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }


            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            header {

                padding: 15px;

            }

        }


        @media (max-width: 450px) {

            .stats {

                grid-template-columns: 1fr;

            }

        }

    </style>

<body>


<header>

    <h1>🍽️ FoodHub</h1>

    <span>Admin • Table Management</span>

</header>


<div class="container">


    <!-- TOP BAR -->

    <div class="top-bar">

        <h2>Table Management</h2>

        <div>

            <button
                class="add-btn"
                onclick="openAddModal()">

                + Add Table

            </button>


            <button
                class="refresh-btn"
                onclick="loadAll()">

                ↻ Refresh

            </button>

        </div>

    </div>


    <!-- STATS -->

    <div class="stats">


        <div class="stat-card total">

            <h3>Total Tables</h3>

            <p id="totalTables">0</p>

        </div>


        <div class="stat-card available">

            <h3>Available</h3>

            <p id="availableTables">0</p>

        </div>


        <div class="stat-card reserved">

            <h3>Reserved</h3>

            <p id="reservedTables">0</p>

        </div>


        <div class="stat-card occupied">

            <h3>Occupied</h3>

            <p id="occupiedTables">0</p>

        </div>


        <div class="stat-card bookings">

            <h3>Active Reservations</h3>

            <p id="activeReservations">0</p>

        </div>


    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Table</th>

                    <th>Seats</th>

                    <th>Current Status</th>

                    <th>Reservation</th>

                    <th>Customer</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="tableBody">

                <tr>

                    <td
                        colspan="6"
                        class="empty">

                        Loading tables...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>



<!-- ==============================
     ADD / EDIT MODAL
================================ -->

<div
    class="modal"
    id="tableModal">


    <div class="modal-box">


        <h2 id="modalTitle">

            Add Table

        </h2>


        <input
            type="hidden"
            id="editId">


        <div class="form-group">

            <label>
                Table Number
            </label>

            <input
                type="number"
                id="tableNumber"
                min="1"
                placeholder="Example: 11">

        </div>


        <div class="form-group">

            <label>
                Number of Seats
            </label>

            <input
                type="number"
                id="seats"
                min="1"
                placeholder="Example: 4">

        </div>


        <div class="form-group">

            <label>
                Status
            </label>

            <select id="tableStatus">

                <option value="Available">
                    Available
                </option>

                <option value="Reserved">
                    Reserved
                </option>

                <option value="Occupied">
                    Occupied
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeModal()">

                Cancel

            </button>


            <button
                class="save-btn"
                onclick="saveTable()">

                Save

            </button>

        </div>


    </div>

</div>



<script>


/* ==========================================
   API
========================================== */

const API = "";


/* ==========================================
   LOAD EVERYTHING
========================================== */

async function loadAll() {

    await Promise.all([

        loadStats(),

        loadTables()

    ]);

}


/* ==========================================
   LOAD STATS
========================================== */

async function loadStats() {

    try {

        const response =
            await fetch(
                API +
                "/api/tables/stats/summary"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load statistics"
            );

        }


        document.getElementById(
            "totalTables"
        ).textContent =
            data.totalTables || 0;


        document.getElementById(
            "availableTables"
        ).textContent =
            data.availableTables || 0;


        document.getElementById(
            "reservedTables"
        ).textContent =
            data.reservedTables || 0;


        document.getElementById(
            "occupiedTables"
        ).textContent =
            data.occupiedTables || 0;


        document.getElementById(
            "activeReservations"
        ).textContent =
            data.activeReservations || 0;


    } catch (error) {

        console.error(error);

    }

}


/* ==========================================
   LOAD TABLES + RESERVATIONS
========================================== */

async function loadTables() {

    const body =
        document.getElementById(
            "tableBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="6"
                class="empty">

                Loading tables...

            </td>

        </tr>

    `;


    try {

        const response =
            await fetch(
                API +
                "/api/tables/reservation-status/all"
            );


        const tables =
            await response.json();


        if (!response.ok) {

            throw new Error(
                tables.message ||
                "Failed to load tables"
            );

        }


        if (
            !tables ||
            tables.length === 0
        ) {

            body.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty">

                        No tables found.

                    </td>

                </tr>

            `;

            return;

        }


        body.innerHTML = "";


        tables.forEach(table => {


            /* ==========================
               STATUS
            ========================== */

            let statusClass =
                "status-available";

            let statusText =
                table.status;


            if (
                table.status ===
                "Occupied"
            ) {

                statusClass =
                    "status-occupied";

            }


            /*
             * A future reservation does
             * not make the physical table
             * unavailable.
             */

            if (
                table.reservation_id
            ) {

                statusText =
                    table.status ===
                    "Occupied"

                        ? "Occupied"

                        : "Reserved";

            }


            /* ==========================
               RESERVATION
            ========================== */

            let reservationHTML =
                `<span class="no-reservation">
                    No active reservation
                 </span>`;


            if (
                table.reservation_id
            ) {

                reservationHTML = `

                    <div class="reservation-info">

                        <strong>
                            Reservation #${table.reservation_id}
                        </strong>

                        <br>

                        📅
                        ${formatDate(
                            table.reservation_date
                        )}

                        <br>

                        ⏰
                        ${formatTime(
                            table.reservation_time
                        )}

                        <br>

                        👥
                        ${table.guests}
                        guests

                    </div>

                `;

            }


            /* ==========================
               CUSTOMER
            ========================== */

            let customerHTML =
                `<span class="no-reservation">
                    —
                 </span>`;


            if (
                table.customer_name
            ) {

                customerHTML = `

                    <div>

                        <div class="customer">

                            ${escapeHTML(
                                table.customer_name
                            )}

                        </div>

                        <small>

                            ${escapeHTML(
                                table.customer_email ||
                                ""
                            )}

                        </small>

                    </div>

                `;

            }


            /* ==========================
               ROW
            ========================== */

            body.innerHTML += `

                <tr>

                    <td>

                        <strong>
                            Table ${table.table_number}
                        </strong>

                    </td>


                    <td>

                        ${table.seats}

                        seats

                    </td>


                    <td>

                        <span
                            class="status
                            ${statusClass}">

                            ${statusText}

                        </span>

                    </td>


                    <td>

                        ${reservationHTML}

                    </td>


                    <td>

                        ${customerHTML}

                    </td>


                    <td>

                        <div class="actions">

                            <button
                                class="edit-btn"
                                onclick='editTable(
                                    ${JSON.stringify(table)}
                                )'>

                                Edit

                            </button>


                            <button
                                class="status-btn"
                                onclick='changeStatus(
                                    ${table.id},
                                    "${table.status}"
                                )'>

                                Status

                            </button>


                            <button
                                class="delete-btn"
                                onclick='deleteTable(
                                    ${table.id}
                                )'>

                                Delete

                            </button>

                        </div>

                    </td>

                </tr>

            `;

        });


    } catch (error) {

        console.error(error);


        body.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty">

                    ❌
                    ${escapeHTML(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   ADD TABLE
========================================== */

function openAddModal() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Table";


    document.getElementById(
        "editId"
    ).value = "";


    document.getElementById(
        "tableNumber"
    ).value = "";


    document.getElementById(
        "seats"
    ).value = "";


    document.getElementById(
        "tableStatus"
    ).value =
        "Available";


    document.getElementById(
        "tableStatus"
    ).disabled = true;


    document.getElementById(
        "tableModal"
    ).style.display =
        "flex";

}


/* ==========================================
   EDIT TABLE
========================================== */

function editTable(table) {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Table";


    document.getElementById(
        "editId"
    ).value =
        table.id;


    document.getElementById(
        "tableNumber"
    ).value =
        table.table_number;


    document.getElementById(
        "seats"
    ).value =
        table.seats;


    document.getElementById(
        "tableStatus"
    ).value =
        table.status;


    document.getElementById(
        "tableStatus"
    ).disabled = false;


    document.getElementById(
        "tableModal"
    ).style.display =
        "flex";

}


/* ==========================================
   CLOSE MODAL
========================================== */

function closeModal() {

    document.getElementById(
        "tableModal"
    ).style.display =
        "none";

}


/* ==========================================
   SAVE TABLE
========================================== */

async function saveTable() {

    const editId =
        document.getElementById(
            "editId"
        ).value;


    const tableNumber =
        Number(
            document.getElementById(
                "tableNumber"
            ).value
        );


    const seats =
        Number(
            document.getElementById(
                "seats"
            ).value
        );


    const status =
        document.getElementById(
            "tableStatus"
        ).value;


    if (
        !Number.isInteger(tableNumber) ||
        tableNumber <= 0
    ) {

        alert(
            "Enter a valid table number"
        );

        return;

    }


    if (
        !Number.isInteger(seats) ||
        seats <= 0
    ) {

        alert(
            "Enter a valid number of seats"
        );

        return;

    }


    try {

        let response;


        if (editId) {

            response =
                await fetch(
                    API +
                    "/api/tables/" +
                    editId,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                table_number:
                                    tableNumber,

                                seats:
                                    seats,

                                status:
                                    status

                            })

                    }
                );

        } else {

            response =
                await fetch(
                    API +
                    "/api/tables",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                table_number:
                                    tableNumber,

                                seats:
                                    seats

                            })

                    }
                );

        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Operation failed"
            );

        }


        alert(
            data.message ||
            "Saved successfully"
        );


        closeModal();

        await loadAll();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* ==========================================
   CHANGE STATUS
========================================== */

async function changeStatus(
    id,
    currentStatus
) {

    const statuses = [

        "Available",
        "Reserved",
        "Occupied"

    ];


    const currentIndex =
        statuses.indexOf(
            currentStatus
        );


    const nextStatus =
        statuses[
            (
                currentIndex + 1
            ) %
            statuses.length
        ];


    const confirmChange =
        confirm(

            `Change table status from "${currentStatus}" to "${nextStatus}"?`

        );


    if (!confirmChange) {
        return;
    }


    try {

        const response =
            await fetch(

                API +
                "/api/tables/" +
                id +
                "/status",

                {

                    method: "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                nextStatus

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update status"
            );

        }


        await loadAll();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* ==========================================
   DELETE TABLE
========================================== */

async function deleteTable(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this table?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(

                API +
                "/api/tables/" +
                id,

                {

                    method:
                        "DELETE"

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete table"
            );

        }


        alert(
            data.message
        );


        await loadAll();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* ==========================================
   FORMAT DATE
========================================== */

function formatDate(date) {

    if (!date) {
        return "—";
    }


    const parts =
        date.split("-");


    if (
        parts.length !== 3
    ) {

        return date;

    }


    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );

}


/* ==========================================
   FORMAT TIME
========================================== */

function formatTime(time) {

    if (!time) {
        return "—";
    }


    const parts =
        time.split(":");


    if (
        parts.length < 2
    ) {

        return time;

    }


    let hour =
        Number(parts[0]);


    const minute =
        parts[1];


    const suffix =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12 || 12;


    return (
        hour +
        ":" +
        minute +
        " " +
        suffix
    );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   CLOSE MODAL ON OUTSIDE CLICK
========================================== */

document.getElementById(
    "tableModal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            closeModal();

        }

    }
);


/* ==========================================
   INITIAL LOAD
========================================== */

loadAll();


/* ==========================================
   AUTO REFRESH
========================================== */

setInterval(
    loadAll,
    30000
);

</script>
