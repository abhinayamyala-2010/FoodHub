<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FoodHub - Billing</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.header {
    background: #222;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
}

.header button {
    background: #e65100;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
}

.container {
    width: 95%;
    max-width: 1400px;
    margin: 25px auto;
}

.cards {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
}

.card h3 {
    margin: 0 0 10px;
    color: #666;
}

.card strong {
    font-size: 25px;
}

.filters {
    background: white;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.filters input,
.filters select {
    padding: 10px;
    margin-right: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.filters button {
    padding: 10px 18px;
    background: #333;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.table-container {
    background: white;
    border-radius: 10px;
    overflow-x: auto;
    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

th {
    background: #333;
    color: white;
    padding: 13px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.status {
    padding: 5px 9px;
    border-radius: 15px;
    font-size: 12px;
    font-weight: bold;
}

.paid {
    background: #d4edda;
    color: #155724;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

.cancelled {
    background: #f8d7da;
    color: #721c24;
}

.action-btn {
    padding: 7px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 2px;
}

.invoice {
    background: #1976d2;
    color: white;
}

.payment {
    background: #388e3c;
    color: white;
}

.loading {
    text-align: center;
    padding: 40px;
}

@media(max-width:800px) {

    .cards {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media(max-width:500px) {

    .cards {
        grid-template-columns: 1fr;
    }

}

</style>


<style id="foodhub-cafe-theme">
:root{--cafe-espresso:#3b2418;--cafe-coffee:#5a3825;--cafe-caramel:#b9783f;--cafe-gold:#d6a15d;--cafe-cream:#fff8ed;--cafe-beige:#f3e5d0;--cafe-latte:#ead4b7;--cafe-text:#2f211a;--cafe-white:#fffdf9;--cafe-shadow:0 8px 24px rgba(59,36,24,.12)}
html,body{background:var(--cafe-cream)!important;color:var(--cafe-text)!important}
body{font-family:Georgia,'Times New Roman',serif!important}
header,.header,.navbar,nav,.nav,.topbar,.sidebar{background:var(--cafe-espresso)!important;color:#fff8ed!important}
header a,.header a,.navbar a,nav a,.nav a,.topbar a,.sidebar a{color:#fff8ed!important}
h1,h2,h3,h4,h5,h6{color:var(--cafe-espresso)!important}
button,.btn,.button,input[type=submit],input[type=button]{background:var(--cafe-coffee)!important;color:#fff8ed!important;border-color:var(--cafe-coffee)!important;border-radius:10px!important;box-shadow:0 3px 8px rgba(59,36,24,.16)!important}
button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{background:var(--cafe-caramel)!important;border-color:var(--cafe-caramel)!important}
a{color:var(--cafe-coffee)}
a:hover{color:var(--cafe-caramel)}
.card,.food-card,.menu-card,.product-card,.order-card,.stat-card,.box,.panel,.container-card,.admin-card,.reservation-card,.review-card,.table-card,.modal-content{background:var(--cafe-white)!important;border-color:var(--cafe-latte)!important;box-shadow:var(--cafe-shadow)!important;border-radius:14px!important}
input,select,textarea{background:#fffdf9!important;color:var(--cafe-text)!important;border:1px solid #d8b994!important;border-radius:8px!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--cafe-caramel)!important;box-shadow:0 0 0 3px rgba(185,120,63,.15)!important}
th{background:var(--cafe-coffee)!important;color:#fff8ed!important}
tr:nth-child(even){background:#fbf1e2!important}
.badge,.status,.tag,.category{background:var(--cafe-beige)!important;color:var(--cafe-espresso)!important}
.logo,.brand{color:var(--cafe-gold)!important}
footer{background:var(--cafe-espresso)!important;color:#fff8ed!important}
img{border-radius:10px}
hr{border-color:var(--cafe-latte)!important}
.cafe-theme-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--cafe-beige);color:var(--cafe-espresso);font-size:13px;font-weight:700;letter-spacing:.4px}
</style>
</head>


<body>


<div class="header">

    <h1>FoodHub Billing</h1>

    <button onclick="goDashboard()">
        Admin Dashboard
    </button>

</div>


<div class="container">


    <!-- SUMMARY -->

    <div class="cards">

        <div class="card">

            <h3>Total Orders</h3>

            <strong id="totalOrders">
                0
            </strong>

        </div>


        <div class="card">

            <h3>Total Revenue</h3>

            <strong>
                ₹<span id="totalRevenue">
                    0.00
                </span>
            </strong>

        </div>


        <div class="card">

            <h3>Paid Orders</h3>

            <strong id="paidOrders">
                0
            </strong>

        </div>


        <div class="card">

            <h3>Pending Payments</h3>

            <strong id="pendingPayments">
                0
            </strong>

        </div>

    </div>



    <!-- FILTER -->

    <div class="filters">

        <input
            type="text"
            id="search"
            placeholder="Search order/customer...">

        <select id="paymentFilter">

            <option value="all">
                All Payments
            </option>

            <option value="Paid">
                Paid
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>


        <button onclick="loadOrders()">
            Search
        </button>

        <button onclick="resetFilters()">
            Reset
        </button>

    </div>



    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Order</th>

                    <th>Customer</th>

                    <th>Date</th>

                    <th>Subtotal</th>

                    <th>Discount</th>

                    <th>GST</th>

                    <th>Delivery</th>

                    <th>Total</th>

                    <th>Payment</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="ordersBody">

                <tr>

                    <td colspan="11"
                        class="loading">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<script>

const API =
    "http://localhost:5000";


let allOrders = [];


/* ==========================================
   LOAD ORDERS
========================================== */

async function loadOrders() {

    try {

        const response =
            await fetch(
                `${API}/api/admin/orders`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load orders"
            );

        }


        allOrders = Array.isArray(data)
            ? data
            : data.orders || [];


        updateSummary(
            allOrders
        );


        displayOrders(
            allOrders
        );


    } catch (error) {

        console.error(error);

        document.getElementById(
            "ordersBody"
        ).innerHTML = `

            <tr>

                <td colspan="11"
                    class="loading">

                    ❌ ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   SUMMARY
========================================== */

function updateSummary(orders) {

    let revenue = 0;

    let paid = 0;

    let pending = 0;


    orders.forEach(order => {

        revenue += Number(
            order.total || 0
        );


        if (
            order.payment_status ===
            "Paid"
        ) {

            paid++;

        }


        if (
            order.payment_status ===
            "Pending"
        ) {

            pending++;

        }

    });


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "totalRevenue"
    ).textContent =
        revenue.toFixed(2);


    document.getElementById(
        "paidOrders"
    ).textContent =
        paid;


    document.getElementById(
        "pendingPayments"
    ).textContent =
        pending;

}


/* ==========================================
   DISPLAY ORDERS
========================================== */

function displayOrders(orders) {

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    const paymentFilter =
        document.getElementById(
            "paymentFilter"
        ).value;


    const filtered =
        orders.filter(order => {

            const customer =
                (
                    order.customer_name ||
                    ""
                ).toLowerCase();


            const email =
                (
                    order.email ||
                    ""
                ).toLowerCase();


            const orderId =
                String(
                    order.id
                );


            const matchesSearch =
                !search ||
                customer.includes(search) ||
                email.includes(search) ||
                orderId.includes(search);


            const matchesPayment =
                paymentFilter === "all" ||
                order.payment_status ===
                    paymentFilter;


            return (
                matchesSearch &&
                matchesPayment
            );

        });


    const body =
        document.getElementById(
            "ordersBody"
        );


    body.innerHTML = "";


    if (filtered.length === 0) {

        body.innerHTML = `

            <tr>

                <td colspan="11"
                    class="loading">

                    No orders found.

                </td>

            </tr>

        `;

        return;

    }


    filtered.forEach(order => {

        const row =
            document.createElement(
                "tr"
            );


        const paymentStatus =
            order.payment_status ||
            "Pending";


        let statusClass =
            "pending";


        if (
            paymentStatus ===
            "Paid"
        ) {

            statusClass =
                "paid";

        }


        if (
            paymentStatus ===
            "Cancelled"
        ) {

            statusClass =
                "cancelled";

        }


        row.innerHTML = `

            <td>
                <strong>
                    #${order.id}
                </strong>
            </td>

            <td>
                ${escapeHtml(
                    order.customer_name ||
                    "Customer"
                )}
            </td>

            <td>
                ${formatDate(
                    order.order_date
                )}
            </td>

            <td>
                ₹${Number(
                    order.subtotal || 0
                ).toFixed(2)}
            </td>

            <td>
                ₹${Number(
                    order.discount || 0
                ).toFixed(2)}
            </td>

            <td>
                ₹${Number(
                    order.gst || 0
                ).toFixed(2)}
            </td>

            <td>
                ₹${Number(
                    order.delivery_charge || 0
                ).toFixed(2)}
            </td>

            <td>
                <strong>
                    ₹${Number(
                        order.total || 0
                    ).toFixed(2)}
                </strong>
            </td>

            <td>
                ${escapeHtml(
                    order.payment_method ||
                    "WhatsApp"
                )}
            </td>

            <td>

                <span class="status ${statusClass}">

                    ${escapeHtml(
                        paymentStatus
                    )}

                </span>

            </td>

            <td>

                <button
                    class="action-btn invoice"
                    onclick="openInvoice(
                        ${order.id}
                    )">

                    Invoice

                </button>


                <button
                    class="action-btn payment"
                    onclick="changePaymentStatus(
                        ${order.id}
                    )">

                    Payment

                </button>

            </td>

        `;


        body.appendChild(row);

    });

}


/* ==========================================
   CHANGE PAYMENT STATUS
========================================== */

async function changePaymentStatus(
    orderId
) {

    const status =
        prompt(
            "Enter payment status:\n\nPaid\nPending\nCancelled",
            "Paid"
        );


    if (!status) {
        return;
    }


    const cleanStatus =
        status.trim();


    if (
        ![
            "Paid",
            "Pending",
            "Cancelled"
        ].includes(cleanStatus)
    ) {

        alert(
            "Please enter only:\nPaid, Pending or Cancelled"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/api/admin/orders/${orderId}/payment-status`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        payment_status:
                            cleanStatus
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update payment"
            );

        }


        alert(
            "Payment status updated!"
        );


        loadOrders();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* ==========================================
   INVOICE
========================================== */

function openInvoice(orderId) {

    window.open(
        `invoice.html?id=${orderId}`,
        "_blank"
    );

}


/* ==========================================
   RESET
========================================== */

function resetFilters() {

    document.getElementById(
        "search"
    ).value = "";


    document.getElementById(
        "paymentFilter"
    ).value = "all";


    displayOrders(
        allOrders
    );

}


/* ==========================================
   DATE
========================================== */

function formatDate(value) {

    if (!value) {
        return "-";
    }


    return String(value)
        .replace("T", " ")
        .substring(0, 16);

}


/* ==========================================
   HTML SAFETY
========================================== */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* ==========================================
   DASHBOARD
========================================== */

function goDashboard() {

    window.location.href =
        "admin-dashboard.html";

}


/* ==========================================
   SEARCH EVENTS
========================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    () => displayOrders(allOrders)
);


document.getElementById(
    "paymentFilter"
).addEventListener(
    "change",
    () => displayOrders(allOrders)
);


/* ==========================================
   START
========================================== */

loadOrders();


/* AUTO REFRESH */

setInterval(
    loadOrders,
    30000
);

</script>


</body>

</html>
