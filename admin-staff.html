<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodHub - Staff Management</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #ff9800;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #ff9800;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            padding: 30px;
        }

        .title {
            margin-bottom: 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search {
            flex: 1;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .add-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .form-box h3 {
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .save-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #777;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        .edit-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            background: #e8f5e9;
        }

        @media (max-width: 700px) {

            .top-section {
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

            .container {
                padding: 15px;
            }

        }

    </style>


<style id="foodhub-cafe-theme">
:root{--cafe-espresso:#3b2418;--cafe-coffee:#5a3825;--cafe-caramel:#b9783f;--cafe-gold:#d6a15d;--cafe-cream:#fff8ed;--cafe-beige:#f3e5d0;--cafe-latte:#ead4b7;--cafe-text:#2f211a;--cafe-white:#fffdf9;--cafe-shadow:0 8px 24px rgba(59,36,24,.12)}
html,body{background:var(--cafe-cream)!important;color:var(--cafe-text)!important}
body{font-family:Georgia,'Times New Roman',serif!important}
header,.header,.navbar,nav,.nav,.topbar,.sidebar{background:var(--cafe-espresso)!important;color:#fff8ed!important}
header a,.header a,.navbar a,nav a,.nav a,.topbar a,.sidebar a{color:#fff8ed!important}
h1,h2,h3,h4,h5,h6{color:var(--cafe-espresso)!important}
button,.btn,.button,input[type=submit],input[type=button]{background:var(--cafe-coffee)!important;color:#fff8ed!important;border-color:var(--cafe-coffee)!important;border-radius:10px!important;box-shadow:0 3px 8px rgba(59,36,24,.16)!important}
button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{background:var(--cafe-caramel)!important;border-color:var(--cafe-caramel)!important}
a{color:var(--cafe-coffee)}
a:hover{color:var(--cafe-caramel)}
.card,.food-card,.menu-card,.product-card,.order-card,.stat-card,.box,.panel,.container-card,.admin-card,.reservation-card,.review-card,.table-card,.modal-content{background:var(--cafe-white)!important;border-color:var(--cafe-latte)!important;box-shadow:var(--cafe-shadow)!important;border-radius:14px!important}
input,select,textarea{background:#fffdf9!important;color:var(--cafe-text)!important;border:1px solid #d8b994!important;border-radius:8px!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--cafe-caramel)!important;box-shadow:0 0 0 3px rgba(185,120,63,.15)!important}
th{background:var(--cafe-coffee)!important;color:#fff8ed!important}
tr:nth-child(even){background:#fbf1e2!important}
.badge,.status,.tag,.category{background:var(--cafe-beige)!important;color:var(--cafe-espresso)!important}
.logo,.brand{color:var(--cafe-gold)!important}
footer{background:var(--cafe-espresso)!important;color:#fff8ed!important}
img{border-radius:10px}
hr{border-color:var(--cafe-latte)!important}
.cafe-theme-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--cafe-beige);color:var(--cafe-espresso);font-size:13px;font-weight:700;letter-spacing:.4px}
</style>
</head>


<body>


<header>

    <h1>FoodHub Admin</h1>

    <a href="admin-dashboard.html">
        Dashboard
    </a>

</header>


<div class="container">

    <h2 class="title">
        Staff Management
    </h2>


    <div
        id="message"
        class="message">
    </div>


    <!-- SEARCH + ADD -->

    <div class="top-section">

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search staff by name or email..."
                oninput="searchStaff()"
            >

        </div>


        <button
            class="add-btn"
            onclick="showForm()">

            + Add Staff

        </button>

    </div>


    <!-- STAFF FORM -->

    <div
        class="form-box"
        id="staffForm">

        <h3 id="formTitle">
            Add Staff
        </h3>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="staffName"
                    placeholder="Enter staff name"
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="staffEmail"
                    placeholder="Enter email"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="staffPassword"
                    placeholder="Enter password"
                >

            </div>


            <div class="form-group">

                <label>
                    Role
                </label>

                <select id="staffRole">

                    <option value="staff">
                        Staff
                    </option>

                    <option value="manager">
                        Manager
                    </option>

                    <option value="chef">
                        Chef
                    </option>

                    <option value="cashier">
                        Cashier
                    </option>

                    <option value="delivery">
                        Delivery
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>

        </div>


        <div class="form-buttons">

            <button
                class="save-btn"
                onclick="saveStaff()">

                Save Staff

            </button>


            <button
                class="cancel-btn"
                onclick="hideForm()">

                Cancel

            </button>

        </div>

    </div>


    <!-- STAFF TABLE -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Created</th>
                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="staffTable">

                <tr>

                    <td colspan="6">
                        Loading staff...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>


const API =
    "http://localhost:5000/api";


let staffList = [];

let editingId = null;


/* ==========================================
   LOAD STAFF
========================================== */

async function loadStaff() {

    try {

        const response =
            await fetch(
                API + "/staff"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load staff"
            );

        }


        staffList =
            await response.json();


        displayStaff(
            staffList
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Failed to load staff"
        );

    }

}


/* ==========================================
   DISPLAY STAFF
========================================== */

function displayStaff(
    data
) {

    const table =
        document.getElementById(
            "staffTable"
        );


    table.innerHTML = "";


    if (data.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="6">

                    No staff members found.

                </td>

            </tr>

        `;

        return;

    }


    data.forEach(
        staff => {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${staff.id}
                </td>

                <td>
                    ${staff.name}
                </td>

                <td>
                    ${staff.email}
                </td>

                <td>
                    ${staff.role}
                </td>

                <td>
                    ${staff.created_at || "-"}
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editStaff(${staff.id})">

                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteStaff(${staff.id})">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


/* ==========================================
   SEARCH
========================================== */

function searchStaff() {

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();


    const filtered =
        staffList.filter(
            staff =>

                staff.name
                    .toLowerCase()
                    .includes(keyword)

                ||

                staff.email
                    .toLowerCase()
                    .includes(keyword)

                ||

                staff.role
                    .toLowerCase()
                    .includes(keyword)
        );


    displayStaff(
        filtered
    );

}


/* ==========================================
   SHOW FORM
========================================== */

function showForm() {

    editingId = null;


    document
        .getElementById(
            "staffForm"
        )
        .style.display = "block";


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
            "Add Staff";


    document
        .getElementById(
            "staffName"
        )
        .value = "";


    document
        .getElementById(
            "staffEmail"
        )
        .value = "";


    document
        .getElementById(
            "staffPassword"
        )
        .value = "";


    document
        .getElementById(
            "staffRole"
        )
        .value = "staff";

}


/* ==========================================
   HIDE FORM
========================================== */

function hideForm() {

    document
        .getElementById(
            "staffForm"
        )
        .style.display = "none";


    editingId = null;

}


/* ==========================================
   SAVE STAFF
========================================== */

async function saveStaff() {

    const name =
        document
            .getElementById(
                "staffName"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "staffEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "staffPassword"
            )
            .value;


    const role =
        document
            .getElementById(
                "staffRole"
            )
            .value;


    if (!name || !email) {

        alert(
            "Name and email are required"
        );

        return;

    }


    if (
        !editingId &&
        !password
    ) {

        alert(
            "Password is required"
        );

        return;

    }


    try {

        let response;


        if (editingId) {

            response =
                await fetch(
                    API +
                    "/staff/" +
                    editingId,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name,
                                email,
                                password:
                                    password || undefined,
                                role

                            })

                    }
                );

        } else {

            response =
                await fetch(
                    API + "/staff",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name,
                                email,
                                password,
                                role

                            })

                    }
                );

        }


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.message ||
                "Operation failed"
            );

            return;

        }


        showMessage(
            editingId
                ? "Staff updated successfully"
                : "Staff added successfully"
        );


        hideForm();


        await loadStaff();


    } catch (error) {

        console.error(error);

        alert(
            "Failed to save staff"
        );

    }

}


/* ==========================================
   EDIT STAFF
========================================== */

function editStaff(id) {

    const staff =
        staffList.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!staff) {

        alert(
            "Staff not found"
        );

        return;

    }


    editingId = id;


    document
        .getElementById(
            "staffForm"
        )
        .style.display = "block";


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
            "Edit Staff";


    document
        .getElementById(
            "staffName"
        )
        .value =
            staff.name;


    document
        .getElementById(
            "staffEmail"
        )
        .value =
            staff.email;


    document
        .getElementById(
            "staffPassword"
        )
        .value = "";


    document
        .getElementById(
            "staffRole"
        )
        .value =
            staff.role;

}


/* ==========================================
   DELETE STAFF
========================================== */

async function deleteStaff(
    id
) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this staff member?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/staff/" +
                id,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.message ||
                "Failed to delete staff"
            );

            return;

        }


        showMessage(
            "Staff deleted successfully"
        );


        await loadStaff();


    } catch (error) {

        console.error(error);

        alert(
            "Failed to delete staff"
        );

    }

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    message
) {

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3000
    );

}


/* ==========================================
   START
========================================== */

loadStaff();

</script>


</body>

</html>
